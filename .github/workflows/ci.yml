name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: validate config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate frontmatter
        run: python3 scripts/validate.py

      - name: Scan for credentials
        run: bash scripts/scan-secrets.sh

      - name: Shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning install.sh sync-from-local.sh scripts/scan-secrets.sh hooks/*.sh

      - name: Verify settings template is valid JSON and secret-free
        run: |
          python3 - <<'PY'
          import json, pathlib, sys

          settings = json.loads(pathlib.Path("settings.template.json").read_text())
          for key, value in settings.get("env", {}).items():
              if not (value.startswith("${") and value.endswith("}")):
                  sys.exit(f"env.{key} must be a ${{PLACEHOLDER}}, got a literal value")
          if settings.get("permissions", {}).get("additionalDirectories"):
              sys.exit("permissions.additionalDirectories must be empty in the template")
          print("settings.template.json ok")
          PY

      - name: Dry-run the installer
        run: |
          export CLAUDE_HOME="$RUNNER_TEMP/claude-home"
          ./install.sh --dry-run
          ./install.sh
          test -f "$CLAUDE_HOME/skills/caveman/SKILL.md"
          test -f "$CLAUDE_HOME/settings.json"
          echo "installer produced a working tree at $CLAUDE_HOME"
