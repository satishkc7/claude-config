name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: validate config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate frontmatter
        run: python3 scripts/validate.py

      - name: Verify skill catalog is current
        run: python3 scripts/gen-catalog.py --check

      - name: Scan for credentials
        run: bash scripts/scan-secrets.sh

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Shellcheck (repo scripts)
        run: shellcheck -S warning install.sh sync-from-local.sh scripts/scan-secrets.sh

      - name: Shellcheck (vendored hooks, advisory)
        continue-on-error: true
        run: shellcheck -S warning hooks/*.sh

      - name: Verify settings template
        run: python3 scripts/check-template.py

      - name: Dry-run the installer
        run: |
          export CLAUDE_HOME="$RUNNER_TEMP/claude-home"
          ./install.sh --dry-run
          ./install.sh
          test -f "$CLAUDE_HOME/skills/caveman/SKILL.md"
          test -f "$CLAUDE_HOME/settings.json"
          echo "installer produced a working tree at $CLAUDE_HOME"
